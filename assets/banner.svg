<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rodrigo Baraldi Costa, AI Builder e estudante de Engenharia de Software na École 42 SP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#151A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      .flow.b { animation-delay: -0.5s; }
      .flow.c { animation-delay: -1s; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 960px 160px; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { clip-path: inset(0 100% 0 0); animation: type 3.2s steps(42) .4s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="960" cy="160" r="190" fill="url(#glow)"/>

  <!-- Texto -->
  <text x="64" y="74" class="m" font-size="16" fill="#8B93B0">~/rodrigo $ whoami</text>
  <text x="64" y="132" class="t" font-size="46" font-weight="700" fill="#F5F7FF">Rodrigo Baraldi Costa</text>
  <rect x="64" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="194" class="t" font-size="24"><tspan font-weight="600" fill="#A78BFA">AI Builder</tspan><tspan fill="#C9CEE3"> · Engenharia de Software na École 42 SP</tspan></text>
  <g class="type">
    <text x="64" y="252" class="m" font-size="17" fill="#8B93B0"><tspan fill="#22D3EE">&gt;</tspan> processo manual → sistema · dado bruto → decisão <tspan class="caret" fill="#22D3EE">▍</tspan></text>
  </g>

  <!-- Orquestração: três modelos ligados a um orquestrador -->
  <g fill="none" stroke-width="2">
    <path d="M960 160 L840 80"  stroke="#7C5CFF" class="flow"/>
    <path d="M960 160 L1090 92" stroke="#22D3EE" class="flow b"/>
    <path d="M960 160 L965 270" stroke="#A78BFA" class="flow c"/>
  </g>

  <circle cx="960" cy="160" r="48" fill="#11162A"/>
  <g class="pulse">
    <circle cx="960" cy="160" r="48" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  </g>
  <text x="960" y="156" class="m" font-size="13" fill="#F5F7FF" text-anchor="middle">agent</text>
  <text x="960" y="173" class="m" font-size="10" fill="#8B93B0" text-anchor="middle">orchestrator</text>

  <g class="m" font-size="14" text-anchor="middle">
    <rect x="782" y="58" width="116" height="40" rx="10" fill="#11162A" stroke="#7C5CFF" stroke-opacity=".7"/>
    <text x="840" y="83" fill="#D9D2FF">Claude</text>
    <rect x="1032" y="72" width="116" height="40" rx="10" fill="#11162A" stroke="#22D3EE" stroke-opacity=".7"/>
    <text x="1090" y="97" fill="#BFF4FC">GPT</text>
    <rect x="907" y="252" width="116" height="40" rx="10" fill="#11162A" stroke="#A78BFA" stroke-opacity=".7"/>
    <text x="965" y="277" fill="#E4DCFF">Gemini</text>
  </g>
</svg>
